<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-label="GM SHAH MD">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.35" stop-color="#ffd700"/>
      <stop offset="0.65" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6d1f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .name {
        font-family: 'Arial Black', Arial, sans-serif;
        font-size: 84px;
        font-weight: 900;
        letter-spacing: 4px;
        fill: url(#gold);
        filter: url(#glow);
        animation: pulse 2.2s ease-in-out infinite;
      }
      .sub {
        font-family: Arial, sans-serif;
        font-size: 24px;
        letter-spacing: 10px;
        fill: #ff3b30;
        animation: pulse 2.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="920" height="180" rx="24" fill="#050505"/>
  <text class="name" x="460" y="92" text-anchor="middle">GM SHAH MD</text>
  <text class="sub" x="460" y="140" text-anchor="middle">WHATSAPP MD BOT</text>
</svg>
